[package]
name = "anim-tool"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
al-math = { path = "../../../crates/al-math", features = ["gpu"] }
al-skeleton = { path = "../../../crates/al-skeleton" }
al-anim = { path = "../../../crates/al-anim" }
winit = "0.30.5"
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
glyphon = "0.12"
serde_json = "1.0.151"

[features]
default = ["serde"]
serde = ["al-math/serde", "al-skeleton/serde"]
