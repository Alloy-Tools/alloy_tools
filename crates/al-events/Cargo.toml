[package]
name = "al-events"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
al-derive = { path = "../al-derive" }
al-structures = { path = "../al-structures", features = ["traits"] }
serde = { version = "1.0.219", features = ["derive"], optional = true }
erased-serde = { version = "0.4.6", optional = true }
tynm = "0.2.0"
paste = "1.0.15"
uuid = { version = "1.26", features = ["v4"] }

[features]
default = []
serde = [
    "dep:serde",
    "dep:erased-serde",
    "al-derive/serde",
    "al-structures/serde_utils",
    "al-structures/collections",
]
json = ["serde", "al-structures/json"]
binary = ["serde", "al-structures/binary"]
borrow = []

[dev-dependencies]
serde_json = "1.0.15"
