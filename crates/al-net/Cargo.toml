[package]
name = "al-net"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
al-crypto = { path = "../al-crypto" }
al-core = { path = "../al-core", features = [
    "base",
    "transport-base",
    "binary",
] }
serde = { version = "1.0.228", features = ["derive"] }
bitcode = { version = "0.6.9", features = ["serde"] }
al-vault = { path = "../al-vault" }
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
tokio = { version = "1", features = ["sync", "net", "time", "io-util"] }
zeroize = { version = "1.8.2", features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "net",
    "time",
    "io-util",
] }
toml = "0.9.8"
